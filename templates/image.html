<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🖼️ Kết quả ảnh</title>
  <style>
    body { font-family: Arial; padding: 30px; background: #f9f9f9; text-align: center; }
    h1 { color: #333; }
    ul { list-style: none; padding: 0; }
    li { margin: 10px; padding: 10px; background: #e0f7fa; border-radius: 8px; }
    a { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>📷 Biển số nhận diện được</h1>
  {% if plates %}
    <ul>
      {% for plate in plates %}
        <li>{{ plate }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>❌ Không có biển số nào được phát hiện.</p>
  {% endif %}
  <a href="/">🔙 Quay lại trang chính</a>
</body>
</html>
