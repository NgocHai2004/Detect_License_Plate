<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🚘 Nhận diện biển số</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f2f5, #e4ecf4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .card-container {
      display: flex;
      gap: 30px;
    }

    .card {
      width: 220px;
      height: 180px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    .card input[type="file"] {
      display: none;
    }

    .card img {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
    }

    .card span {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

  </style>
</head>
<body>

  <h1>🚘 Nhận diện biển số - Chọn loại dữ liệu</h1>

  <div class="card-container">
    <!-- Ảnh -->
    <label class="card" for="imageFile">
      <img src="https://img.icons8.com/fluency/96/image.png" alt="Image Icon" />
      <span>🖼️ Ảnh</span>
      <input type="file" id="imageFile" accept="image/*" />
    </label>

    <!-- Video -->
    <label class="card" for="videoFile">
      <img src="https://img.icons8.com/fluency/96/video.png" alt="Video Icon" />
      <span>🎥 Video</span>
      <input type="file" id="videoFile" accept="video/*" />
    </label>
  </div>

  <script>
    // Xử lý chọn ảnh
    document.getElementById("imageFile").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);

      fetch("/image", {
        method: "POST",
        body: formData
      }).then(() => {
        window.location.href = "/image";
      });
    });

    // Xử lý chọn video
    document.getElementById("videoFile").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);

      fetch("/video", {
        method: "POST",
        body: formData
      }).then(() => {
        window.location.href = "/video";
      });
    });
  </script>

</body>
</html>
